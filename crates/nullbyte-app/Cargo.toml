[package]
name = "nullbyte-app"
version = "0.1.0"
description = "A cross-platform (macOS + Linux) retro game emulation frontend built on libretro cores"
authors = ["MontyNau"]
homepage = "https://github.com/montynau/nullbyte"
repository = "https://github.com/montynau/nullbyte"
license = "MIT"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nullbyte_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nullbyte-core = { path = "../nullbyte-core" }

tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "sync", "time", "macros", "net", "io-util"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
walkdir = "2"
crc32fast = "1"
md-5 = "0.10"
sha1 = "0.10"
# P6.1: credentials iš .env, ne hardkodinti (MVP.md acceptance) — naujas priklausomumas,
# žr. MVP.md P6.1 pastabą dėl priežasties.
dotenvy = "0.15"
# P6.4: scrape_library() atšaukimas (MVP.md acceptance) — `tokio_util::sync::CancellationToken`.
# Jau tranzityvi priklausomybė (per `tauri`), bet reikia tiesioginio įrašo Cargo.toml, kad
# `use tokio_util::...` kompiliuotųsi (Cargo neduoda `use` prieigos vien dėl to, kad kažkas
# kitas jį tranzityviai atsivelka).
tokio-util = "0.7"
# P7.6 Audio panelė: `list_audio_devices` komandai — TIK enumeracija (`host.output_devices()`),
# jokio garso srauto TĖVO procese (garso atkūrimas lieka `nullbyte-core`/`nullbyte-emu` pusėje,
# CLAUDE.md §3.4). Jau vetuota workspace priklausomybė (naudojama `nullbyte-core`), čia tik
# nauja NAUDOJIMO vieta, ne nauja priklausomybė kaip tokia.
cpal = "0.16"
# P7.3 real bug fix (ADR-041, 2026-08-27): Tauri `asset://` protokolas WebKitGTK (Linux)
# video/audio elementams nepatikimas — trūksta HTTP Range palaikymo, kurio <video> reikalauja
# net pradiniam atkūrimo bandymui (patikrinta realiai: WebKit atmeta „FormatError" per kelias
# milisekundes, PRIEŠ pasiekiant tinklo sluoksnį, nors GStreamer pats failą skaito be
# problemų). Sprendimas: tikras HTTP serveris 127.0.0.1 ant OS parinkto laisvo porto,
# `tower_http::services::ServeDir` Range užklausas apdoroja teisingai pagal HTTP spec. Veikia
# VISOMS platformoms vienodai — supaprastina architektūrą, ne vien Linux apejimas.
axum = "0.8"
tower-http = { version = "0.7", features = ["fs"] }

[dev-dependencies]
# "test" atrakina tauri::test::{mock_builder, mock_context, noop_assets} — naudoja
# ipc.rs #[ignore]'intas realaus sidecar spawn'inimo testas.
tauri = { version = "2.11", features = ["test"] }
# hasher.rs testui, kuris sukonstruoja .zip archyvą in-memory (ta pati versija kaip
# nullbyte-core, kur `zip` yra runtime priklausomybė archyvų skaitymui).
zip = "2"
