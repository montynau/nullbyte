[package]
name = "nullbyte-core"
version = "0.1.0"
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

libloading = "0.8"
wgpu = "26"
raw-window-handle = "0.6"
pollster = "1"
cpal = "0.16"
rubato = "0.16"
rtrb = "0.3"
gilrs = "0.11"
thiserror = "2"
tracing = "0.1"
md-5 = "0.10"
sha1 = "0.10"
crc32fast = "1"
zip = "2"
sevenz-rust = "0.6"
spin_sleep = "1.3"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
